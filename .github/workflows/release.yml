name: Release

# Cut a GitHub Release with downloadable installers. Trigger by
# pushing a tag like v0.2.0 (or manually via workflow_dispatch,
# which releases from the ref you run it on using the tag input).
#
# Assets produced (all lite -- no model weights; GitHub caps release
# assets at 2 GB. Full model-bearing bundles remain a
# Build-Bundle.bat artifact for USB delivery):
#
#   InscriptionSuite-Online-Setup.exe   tiny installer; downloads the
#                                       payload from THIS release and
#                                       verifies a SHA-256 baked into
#                                       the exe at build time
#   InscriptionSuite-Setup.exe          offline lite: payload embedded
#   InscriptionSuite-Payload.zip        the bundle itself (what the
#                                       online installer fetches)
#   SHA256SUMS.txt                      checksums for all of the above

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build installers and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install packages (editable, with PyInstaller via [dev])
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e suite_common -e "inscription[dev]" -e "caseforge[dev]" -e "caseguide[dev]"

      - name: Build the three app bundles
        run: .\build.ps1

      - name: Stage lite bundle
        shell: pwsh
        run: |
          .\scripts\stage-lite-bundle.ps1 -Destination "$env:RUNNER_TEMP\stage" -Tag "${{ steps.tag.outputs.tag }}"

      # Run the real installer against the staged bundle before anything
      # is published. This is exactly the path a user hits after
      # extraction, so a manifest-schema drift between
      # stage-lite-bundle.ps1 and install.ps1 (which once shipped and
      # failed on a real workstation with 744 "unexpected file" errors)
      # fails the release build here instead.
      - name: Smoke-test install.ps1 against the staged bundle
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP\stage\InscriptionSuite-Airgapped"
          $target = "$env:RUNNER_TEMP\install-test"
          # A throw inside install.ps1 (e.g. failed manifest verification)
          # propagates as a terminating error and fails this step.
          & "$bundle\install.ps1" -InstallRoot $target -Force
          foreach ($f in @("Inscription\Inscription.exe", "CaseForge\CaseForge.exe", "CaseGuide\CaseGuide.exe", "start-suite.ps1", "version.json")) {
            if (-not (Test-Path (Join-Path $target $f))) { throw "Smoke install missing $f" }
          }
          Write-Host "Smoke install OK: bundle verified and installed to $target"

      - name: Build payload zip + offline Setup.exe
        shell: pwsh
        run: |
          .\scripts\make-single-exe.ps1 `
            -StagedBundle "$env:RUNNER_TEMP\stage\InscriptionSuite-Airgapped" `
            -Output "$env:RUNNER_TEMP\out\InscriptionSuite-Setup.exe" `
            -KeepPayloadZip "$env:RUNNER_TEMP\out\InscriptionSuite-Payload.zip"

      - name: Build online installer (payload URL + SHA-256 baked in)
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $payload = "$env:RUNNER_TEMP\out\InscriptionSuite-Payload.zip"
          $sha = (Get-FileHash -Algorithm SHA256 $payload).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/InscriptionSuite-Payload.zip"
          @(
            "TAG = '$tag'"
            "PAYLOAD_URL = '$url'"
            "PAYLOAD_SHA256 = '$sha'"
          ) | Set-Content scripts\_release_meta.py -Encoding utf8
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name InscriptionSuite-Online-Setup `
            --distpath "$env:RUNNER_TEMP\out" `
            --workpath "$env:RUNNER_TEMP\stub-build" `
            --specpath "$env:RUNNER_TEMP\stub-build" `
            --paths scripts `
            --hidden-import suite_common.selfextract `
            --hidden-import _release_meta `
            scripts\setup_stub.py

      - name: Checksums
        shell: pwsh
        run: |
          cd "$env:RUNNER_TEMP\out"
          Get-ChildItem -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Inscription Suite ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Asset | Use it when |
            |---|---|
            | **InscriptionSuite-Online-Setup.exe** | You have internet on the target machine — small download, fetches and verifies the payload from this release |
            | **InscriptionSuite-Setup.exe** | You want one file to carry to a machine (USB, share) — payload embedded, runs offline |
            | InscriptionSuite-Payload.zip | The raw bundle (what the online installer downloads) |
            | SHA256SUMS.txt | Verify any download: `Get-FileHash <file> -Algorithm SHA256` |

            These are **lite** builds: the apps plus installer, **no bundled AI models** (GitHub caps release assets at 2 GB). Everything works out of the box except the optional AI rewrite/refine and audio transcription — enable those by installing [Ollama](https://ollama.com) and/or [Whisper](https://github.com/silvance/whisper.py) locally, or use `Build-Bundle.bat` to create the full model-bearing USB bundle for air-gapped workstations.

            SmartScreen note: unsigned executables show a warning on first run — "More info" → "Run anyway".
          files: |
            ${{ runner.temp }}/out/InscriptionSuite-Online-Setup.exe
            ${{ runner.temp }}/out/InscriptionSuite-Setup.exe
            ${{ runner.temp }}/out/InscriptionSuite-Payload.zip
            ${{ runner.temp }}/out/SHA256SUMS.txt
